name: Branch memory transaction cleanup

on:
  push:
    branches:
      - agent/crash-safe-checkpoints

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crash-safe-checkpoints
      - name: Atomically persist memory events and completion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/storage/platform-store.ts')
          source = store.read_text(encoding='utf-8')
          old = '''  markCheckpointMemoryCompleted(id: string, leaseOwner: string, leaseDurationMs: number): CheckpointRunRecord {
    return this.platform.transaction(() => markCheckpointStep(
      this.platform.db,
      id,
      leaseOwner,
      "memory_completed_at",
      leaseDurationMs
    ));
  }'''
          new = '''  markCheckpointMemoryCompleted(
    id: string,
    leaseOwner: string,
    events: Array<{ type: string; phaseId: string | null; payload: Record<string, unknown> }>,
    leaseDurationMs: number
  ): CheckpointRunRecord {
    return this.platform.transaction(() => {
      const run = required(this.getCheckpointRun(id), `unknown checkpoint run: ${id}`);
      if (run.memoryCompletedAt) return run;
      for (const event of events) this.platformEvent(event.type, event.phaseId, event.payload);
      return markCheckpointStep(
        this.platform.db,
        id,
        leaseOwner,
        "memory_completed_at",
        leaseDurationMs
      );
    });
  }'''
          if old not in source:
              raise SystemExit('memory completion method not found')
          store.write_text(source.replace(old, new, 1), encoding='utf-8')

          checkpoint = Path('src/core/checkpoint.ts')
          text = checkpoint.read_text(encoding='utf-8')
          old_call = '''      for (const event of memory.events) this.store.appendEvent(event.type, event.phaseId, event.payload);
      this.store.markCheckpointMemoryCompleted(run.id, owner, LEASE_DURATION_MS);'''
          new_call = '''      this.store.markCheckpointMemoryCompleted(
        run.id,
        owner,
        memory.events,
        LEASE_DURATION_MS
      );'''
          if old_call not in text:
              raise SystemExit('memory completion call not found')
          checkpoint.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')

          test = Path('tests/checkpoint-recovery.test.ts')
          test_source = test.read_text(encoding='utf-8')
          marker = '''      expect(patterns).toHaveLength(1);
      expect(patterns[0]?.successCount).toBe(1);'''
          replacement = '''      expect(patterns).toHaveLength(1);
      expect(patterns[0]?.successCount).toBe(1);
      const service = await KeepCodingService.open(root);
      try {
        const memoryEvents = service.store.eventsSince(0)
          .filter((event) => event.type === "playbook_pattern_recorded");
        expect(memoryEvents).toHaveLength(1);
      } finally {
        service.close();
      }'''
          if marker not in test_source:
              raise SystemExit('playbook assertion marker not found')
          test.write_text(test_source.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Commit atomic memory finalization
        run: |
          if git diff --quiet -- src/storage/platform-store.ts src/core/checkpoint.ts tests/checkpoint-recovery.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/storage/platform-store.ts src/core/checkpoint.ts tests/checkpoint-recovery.test.ts
          git commit -m "Make checkpoint memory finalization atomic"
          git push origin HEAD:agent/crash-safe-checkpoints

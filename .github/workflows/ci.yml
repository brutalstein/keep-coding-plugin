name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: keep-coding-dist
          path: plugins/keep-coding/dist/keep-coding.mjs
          if-no-files-found: error
      - name: Commit validated distributable
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- plugins/keep-coding/dist/keep-coding.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/keep-coding/dist/keep-coding.mjs
          git commit -m "Build validated distributable"
          git push

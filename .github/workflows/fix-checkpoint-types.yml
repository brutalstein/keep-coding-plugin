name: Branch checkpoint type cleanup

on:
  push:
    branches:
      - agent/crash-safe-checkpoints

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crash-safe-checkpoints
      - name: Apply exact type-safe replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('src/core/checkpoint.ts')
          text = checkpoint.read_text(encoding='utf-8')
          text = text.replace(
              '    const project = this.store.getProject();\n    if (!project?.contract) throw new Error("project contract is missing");',
              '    const project = this.store.getProject();\n    const contract = project?.contract;\n    if (!project || !contract) throw new Error("project contract is missing");',
              1,
          )
          text = text.replace(
              '    await this.enforceAssumptionPolicy(options.workspaceGit, phase, project.contract, changedFiles);',
              '    await this.enforceAssumptionPolicy(options.workspaceGit, phase, contract, changedFiles);',
              1,
          )
          text = text.replace(
              '        const evidence = await this.verifyRun(run, options, phase, project, baseline);',
              '        const evidence = await this.verifyRun(run, options, phase, contract, baseline);',
              1,
          )
          text = text.replace(
              '    project: ProjectRecord & { contract: NonNullable<ProjectRecord["contract"]> },',
              '    contract: NonNullable<ProjectRecord["contract"]>,',
              1,
          )
          text = text.replace('project.contract.selectiveTests', 'contract.selectiveTests')
          text = text.replace('      contract: project.contract,', '      contract,', 1)
          checkpoint.write_text(text, encoding='utf-8')

          service = Path('src/core/service.ts')
          source = service.read_text(encoding='utf-8')
          source = source.replace(
              '      store.appendEvent("checkpoint_recovery_scanned", null, recovery);',
              '      store.appendEvent("checkpoint_recovery_scanned", null, { ...recovery });',
              1,
          )
          service.write_text(source, encoding='utf-8')
          PY
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet -- src/core/checkpoint.ts src/core/service.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/core/checkpoint.ts src/core/service.ts
          git commit -m "Fix checkpoint recovery types"
          git push origin HEAD:agent/crash-safe-checkpoints

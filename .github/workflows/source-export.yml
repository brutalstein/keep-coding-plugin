name: Source Export

on:
  push:
    branches:
      - agent/critical-fixes-token-efficiency

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: keep-coding-source
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          retention-days: 1

name: Keep Coding Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: keep-coding-dist
          path: plugins/keep-coding/dist/keep-coding.mjs
          if-no-files-found: error

  synchronize-bundle:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'agent/'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated bundle when changed
        run: |
          if git diff --quiet -- plugins/keep-coding/dist/keep-coding.mjs; then
            echo "Committed bundle is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/keep-coding/dist/keep-coding.mjs
          git commit -m "Build v0.2 plugin bundle"
          git push origin "HEAD:${TARGET_BRANCH}"

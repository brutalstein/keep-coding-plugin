name: Keep Coding Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: keep-coding-dist
          path: plugins/keep-coding/dist/keep-coding.mjs
          if-no-files-found: error

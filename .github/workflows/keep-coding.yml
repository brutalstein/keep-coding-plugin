name: Keep Coding verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: keep-coding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify bundled CLI
        run: |
          node plugins/keep-coding/dist/keep-coding.mjs version
          node plugins/keep-coding/dist/keep-coding.mjs --help || true
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: keep-coding-0.2.0-dist
          path: plugins/keep-coding/dist/keep-coding.mjs
          if-no-files-found: error
          retention-days: 14

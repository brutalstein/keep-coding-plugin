name: Branch checkpoint cleanup

on:
  push:
    branches:
      - agent/crash-safe-checkpoints

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crash-safe-checkpoints
      - name: Apply exact source cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('src/core/checkpoint.ts')
          text = target.read_text(encoding='utf-8')
          text = text.replace('  PhaseDefinition,\n', '')
          text = text.replace('    let phaseCommit = await git.checkpointCommit(run.id, record.branch);', '    const phaseCommit = await git.checkpointCommit(run.id, record.branch);')
          text = text.replace('      phaseCommit = await isolated.commitFilesForRun(', '      await isolated.commitFilesForRun(')
          target.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet -- src/core/checkpoint.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/checkpoint.ts
          git commit -m "Fix checkpoint recovery lint"
          git push origin HEAD:agent/crash-safe-checkpoints

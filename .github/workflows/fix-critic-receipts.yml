name: Branch critic receipt cleanup

on:
  push:
    branches:
      - agent/crash-safe-checkpoints

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crash-safe-checkpoints
      - name: Apply exact migration-safe SQL replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/storage/platform-store.ts')
          text = store.read_text(encoding='utf-8')
          old = '''    this.platform.db.prepare(`
      INSERT INTO critic_reviews(id,phase_id,evidence_json,created_at,run_id)
      VALUES(?,?,?,?,?) ON CONFLICT(run_id) DO NOTHING
    `).run(randomUUID(), phaseId, JSON.stringify(evidence.critic), now(), runId);'''
          new = '''    this.platform.db.prepare(`
      INSERT OR IGNORE INTO critic_reviews(id,phase_id,evidence_json,created_at,run_id)
      VALUES(?,?,?,?,?)
    `).run(randomUUID(), phaseId, JSON.stringify(evidence.critic), now(), runId);'''
          if old not in text:
              raise SystemExit('critic receipt statement not found')
          store.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('src/storage/platform-runtime.ts')
          source = runtime.read_text(encoding='utf-8')
          old_runtime = '  db.prepare("INSERT INTO critic_reviews VALUES (?, ?, ?, ?)").run(randomUUID(), phaseId, JSON.stringify(evidence), now());'
          new_runtime = '  db.prepare("INSERT INTO critic_reviews(id, phase_id, evidence_json, created_at) VALUES (?, ?, ?, ?)").run(randomUUID(), phaseId, JSON.stringify(evidence), now());'
          if old_runtime not in source:
              raise SystemExit('legacy critic insert not found')
          runtime.write_text(source.replace(old_runtime, new_runtime, 1), encoding='utf-8')
          PY
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet -- src/storage/platform-store.ts src/storage/platform-runtime.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/storage/platform-store.ts src/storage/platform-runtime.ts
          git commit -m "Make critic receipts migration-safe"
          git push origin HEAD:agent/crash-safe-checkpoints
